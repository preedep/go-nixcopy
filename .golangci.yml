run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam

linters-settings:
  goimports:
    local-prefixes: github.com/preedep/go-nixcopy

issues:
  exclude-rules:
    # Test files may use unexported identifiers freely
    - path: _test\.go
      linters:
        - unparam
