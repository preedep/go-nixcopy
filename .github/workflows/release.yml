name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build release binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/v} ./build-release.sh all

      - name: List release artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          body: |
            ## go-nixcopy ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ### Downloads

            | Platform | Architecture | File |
            |---|---|---|
            | Linux | amd64 | `nixcopy-linux-amd64` |
            | Linux | arm64 | `nixcopy-linux-arm64` |
            | macOS | amd64 (Intel) | `nixcopy-darwin-amd64` |
            | macOS | arm64 (Apple Silicon) | `nixcopy-darwin-arm64` |
            | Windows | amd64 | `nixcopy-windows-amd64.exe` |
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
