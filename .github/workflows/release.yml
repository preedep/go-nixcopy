name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  IMAGE_NAME: nickmsft/gonixcopy

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git describe in build-release.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run tests
        run: go test -race -covermode=atomic -count=1 ./...

      - name: Build release binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v} ./build-release.sh all

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          echo "--- checksums ---"
          cat checksums.txt

      - name: List release artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "go-nixcopy ${{ github.ref_name }}"
          body: |
            ## go-nixcopy ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full release notes.

            ### Downloads

            | Platform | Architecture | File |
            |---|---|---|
            | Linux | amd64 (x86-64) | `nixcopy-linux-amd64` |
            | Linux | arm64 (aarch64) | `nixcopy-linux-arm64` |
            | Linux | 386 (x86-32) | `nixcopy-linux-386` |
            | macOS | amd64 (Intel) | `nixcopy-darwin-amd64` |
            | macOS | arm64 (Apple Silicon) | `nixcopy-darwin-arm64` |
            | Windows | amd64 | `nixcopy-windows-amd64.exe` |
            | Windows | 386 | `nixcopy-windows-386.exe` |
            | FreeBSD | amd64 | `nixcopy-freebsd-amd64` |

            ### Verify integrity

            ```bash
            sha256sum -c checksums.txt
            ```

            ### Quick start

            ```bash
            # Linux / macOS
            chmod +x nixcopy-linux-amd64
            ./nixcopy-linux-amd64 --help

            # Docker (distroless, non-root)
            docker pull nickmsft/gonixcopy:${{ github.ref_name }}
            ```
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
