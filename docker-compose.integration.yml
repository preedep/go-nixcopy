# docker-compose.integration.yml — local integration-test environment
#
# Services:
#   sftp        — atmoz/sftp      port 2222          user: testuser / testpass
#   ftps        — pure-ftpd       port 21, passive 30000-30009  explicit TLS (self-signed)
#   minio       — MinIO           port 9000          S3-compatible
#   minio-setup — one-shot job that creates test-bucket once MinIO is healthy
#
# Usage:
#   make integration-test-local    # up, run tests, down
#   make integration-test-down     # tear down only

services:
  sftp:
    image: atmoz/sftp:latest
    command: "testuser:testpass:::upload"
    ports:
      - "2222:22"
    healthcheck:
      # Upload directory is created by the startup script — presence means sshd is ready.
      test: ["CMD-SHELL", "test -d /home/testuser/upload"]
      interval: 2s
      timeout: 5s
      retries: 15

  ftps:
    image: stilliard/pure-ftpd:latest
    environment:
      FTP_USER_NAME: testuser
      FTP_USER_PASS: testpass
      FTP_USER_HOME: /home/testuser
      # Advertise the loopback address so passive-mode data connections reach the
      # mapped host ports (30000-30009) rather than the container-internal IP.
      PUBLICHOST: "127.0.0.1"
      PASSIVE_MIN_PORT: "30000"
      PASSIVE_MAX_PORT: "30009"
      # --tls=1  allow both clear-text and TLS; a self-signed cert is auto-generated.
      ADDED_FLAGS: "--tls=1"
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    healthcheck:
      test: ["CMD-SHELL", "ps -e -o comm | grep -q pure-ftpd"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 15

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: "http://minioadmin:minioadmin@minio:9000"
    entrypoint: ["mc", "mb", "--ignore-existing", "local/test-bucket"]
    restart: "no"
